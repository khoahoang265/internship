<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình thực tập Bosch</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style id="app-style">
:root{
  --ground:#F3F5F7; --surface:#FFFFFF; --sunk:#E9EDF1; --line:#D6DDE3;
  --ink:#15212C; --muted:#5A6874; --faint:#8894A0;
  --accent:#0C6B74; --accent-soft:#DDEFF0; --on-accent:#FFFFFF;
  --late:#B23A2E; --late-soft:#F8E3E0; --soon:#A25A0F; --soon-soft:#F7EBD9;
  --ok:#2C7A4B; --ok-soft:#E0F0E6;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F161C; --surface:#172129; --sunk:#1E2A33; --line:#2A3843;
    --ink:#E4EAEF; --muted:#9BA8B3; --faint:#6F7C87;
    --accent:#4FB8C2; --accent-soft:#16363B; --on-accent:#0B1418;
    --late:#F08A7E; --late-soft:#3A1F1C; --soon:#E7AE62; --soon-soft:#352A18;
    --ok:#6CC592; --ok-soft:#16301F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0F161C; --surface:#172129; --sunk:#1E2A33; --line:#2A3843;
  --ink:#E4EAEF; --muted:#9BA8B3; --faint:#6F7C87;
  --accent:#4FB8C2; --accent-soft:#16363B; --on-accent:#0B1418;
  --late:#F08A7E; --late-soft:#3A1F1C; --soon:#E7AE62; --soon-soft:#352A18;
  --ok:#6CC592; --ok-soft:#16301F; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
header.top{display:grid;gap:18px;margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:clamp(26px,4vw,36px);line-height:1.15;margin:4px 0 0;text-wrap:balance;font-weight:700}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.stat .v{font-size:22px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.next-title{font-weight:600;line-height:1.35}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 16px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.save{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.save[data-s="saving"]::before{background:var(--soon)}
.save[data-s="saved"]::before{background:var(--ok)}
.save[data-s="local"]::before{background:var(--faint)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.phase{position:relative;padding-left:30px;padding-bottom:26px}
.phase::before{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:var(--line)}
.phase:last-child::before{display:none}
.phase .node{position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--ground)}
.phase[data-state="done"] .node{background:var(--ok);border-color:var(--ok)}
.phase[data-state="now"] .node{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.phase-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.phase-head h2{font-size:18px;margin:0;font-weight:700}
.phase-head .range{font-size:12.5px;color:var(--accent);font-weight:500}
.phase-head .count{margin-left:auto;font-size:12.5px;color:var(--muted)}
.tasks{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.task{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.task input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.task input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.task label{font-weight:600;cursor:pointer;line-height:1.4}
.task.is-done label{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.chip{font-size:11.5px;white-space:nowrap;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);align-self:start;margin-top:1px}
.chip[data-s="late"]{background:var(--late-soft);color:var(--late)}
.chip[data-s="soon"]{background:var(--soon-soft);color:var(--soon)}
.chip[data-s="done"]{background:var(--ok-soft);color:var(--ok)}
.detail{grid-column:2 / 4;color:var(--muted);font-size:13.5px}
.detail ul{margin:4px 0 0;padding-left:18px}
.detail li{margin:2px 0}
.detail b{color:var(--ink);font-weight:600}
.task.is-done .detail{display:none}
.task.is-done.open .detail{display:block}
.meta{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.src{font-size:11px;color:var(--faint);letter-spacing:.02em}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--soon-soft);color:var(--soon)}
.more{font:inherit;font-size:11.5px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
aside{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
@media (max-width:900px){aside{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.panel h3{margin:0 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.panel.alert{border-color:var(--soon);background:var(--soon-soft)}
.panel.alert h3{color:var(--soon)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-weight:500;text-align:right}
.weights{display:grid;gap:8px;font-size:13px}
.w{display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.w .bar{grid-column:1 / 3;height:6px}
.panel p{margin:0 0 6px;font-size:13px}
.panel p:last-child{margin-bottom:0}
.contacts{display:grid;gap:8px;font-size:13px}
.contacts div span{display:block;color:var(--muted);font-size:12px;word-break:break-word}
.empty{padding:14px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.jump{color:var(--accent);font-weight:600}
.guide{margin-top:40px}
.guide-head h2{font-size:22px;margin:0 0 4px;font-weight:700}
.guide-head p{color:var(--muted);margin:0 0 16px;max-width:70ch;font-size:14px}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;align-items:start}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:13.5px;line-height:1.6}
.gcard.wide{grid-column:1/-1}
.gcard h3{margin:0 0 8px;font-size:16px;font-weight:700}
.gcard h4{margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gcard p{margin:0 0 8px}
.gcard p:last-child{margin-bottom:0}
.gcard ul,.gcard ol{margin:4px 0 8px;padding-left:20px}
.gcard li{margin:3px 0}
.gcard b{font-weight:600}
.g-lead{color:var(--muted)}
.gcard .bad,.gcard .good{padding:8px 10px;border-radius:8px;border-left:3px solid}
.gcard .bad{background:var(--late-soft);border-color:var(--late)}
.gcard .good{background:var(--ok-soft);border-color:var(--ok)}
.gcard pre{background:var(--sunk);border-radius:8px;padding:12px 14px;overflow-x:auto;font:12.5px/1.55 ui-monospace,Consolas,monospace;margin:4px 0 10px}
.gcard table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0;display:block;overflow-x:auto}
.gcard th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.gcard td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.gcard .g-road td:first-child{white-space:nowrap;font-weight:600}
.tagx{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--faint);white-space:nowrap}
.g-note{background:var(--accent-soft);color:var(--accent);padding:10px 12px;border-radius:8px}

.btn{font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.save[data-s="error"]::before{background:var(--late)}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:560px;width:100%;display:grid;gap:8px;max-height:90vh;overflow:auto}
.modal-card h2{margin:0;font-size:18px}
.modal-card p{margin:0;color:var(--muted);font-size:13px}
.modal-card label{font-size:12px;font-weight:600;color:var(--muted)}
.modal-card input#cfg-url,.modal-card input#cfg-key{width:100%;font:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink)}
#cfg-msg{padding:10px 12px;border-radius:8px;background:var(--sunk);line-height:1.5;word-break:break-word}
#cfg-msg[data-kind="bad"]{background:var(--late-soft);color:var(--late)}
#cfg-msg[data-kind="ok"]{background:var(--ok-soft);color:var(--ok)}
.modal-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hint{font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<script type="application/json" id="saved-state">{"done":[]}</script>

<script id="app-script">
(function(){
const TODAY = (()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const P = (s)=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt = (s)=>{const d=P(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()};
const SRC = {bosch:'Email offer Bosch', jd:'JD Bosch', reg:'ECE Registration Process', form:'ECE Registration Form', guide:'ECE Internship Guidelines', monthly:'Guideline báo cáo tháng', final:'Guideline báo cáo cuối', done:'ECE Completion Process', tip:'Gợi ý thêm'};

const PHASES = [
{id:'A', name:'Làm ngay', range:'15 – 16/09/2026', start:'2026-09-15', end:'2026-09-16', tasks:[
 {id:'a1', due:'2026-09-16', label:'11:11 sáng 16/09', t:'Trả lời email Bosch để xác nhận nhận offer', d:'Reply thẳng vào email offer, <b>trước 11:11 sáng Thứ Tư 16/09/2026</b>. Tiện hỏi luôn HR: bạn làm ở văn phòng TP.HCM hay Hà Nội (để biết có cần gửi ảnh thẻ không).', s:['bosch']},
 {id:'a2', due:'2026-09-15', t:'Gửi yêu cầu xin thư giới thiệu từ VGU', d:'Hạn nộp bản mềm cho Bosch chỉ còn 3 ngày — gửi yêu cầu ngay cho ECE Office (ece_program@vgu.edu.vn). Thư bắt buộc có:<ul><li>Họ tên, ngày sinh, mã sinh viên, số CCCD</li><li>Tên trường: Vietnamese-German University</li><li>Thời gian thực tập: 02/10/2026 – 25/03/2027</li><li>Chữ ký đại diện trường + dấu chính thức</li><li>Ngày cấp thư phải <b>trước</b> ngày bắt đầu thực tập</li></ul>', s:['bosch','jd']},
 {id:'a3', due:'2026-09-16', t:'Kiểm tra đủ điều kiện đăng ký môn Internship', d:'Cần <b>≥ 120 ECTS</b>, không tính các môn tiếng Đức — xem trên SIS. Nếu thiếu, AC/EB sẽ xét từng trường hợp.', s:['reg','guide']},
 {id:'a4', due:'2026-09-18', t:'Tìm giảng viên hướng dẫn (GVHD) ở VGU', d:'Là giảng viên hoặc kỹ sư lab. Nếu không tìm được, báo ECE Office để được phân công. Cần chữ ký GVHD trước khi nộp form đăng ký.', s:['reg','guide']},
 {id:'a5', label:'Nếu làm ở Hà Nội', opt:true, t:'Gửi ảnh chân dung làm thẻ ra vào', d:'Chỉ áp dụng cho văn phòng Hà Nội. JD ghi địa điểm 364 Cộng Hòa, Tân Bình, TP.HCM nên nhiều khả năng bạn <b>không</b> cần bước này. Nếu cần: ảnh kiểu hộ chiếu, nền trắng (có thể dùng remove.bg), tên file <b>Intern_Hoang Minh Khoa</b>, gửi bằng cách reply email offer.', s:['bosch','jd']},
]},
{id:'B', name:'Nộp thư giới thiệu cho Bosch', range:'Hạn 18/09/2026', start:'2026-09-17', end:'2026-09-18', tasks:[
 {id:'b1', due:'2026-09-18', t:'Gửi bản mềm (scan PDF) thư giới thiệu cho Bosch', d:'Hạn <b>Thứ Sáu 18/09/2026</b>. Kiểm tra lại đủ các nội dung bắt buộc ở trên trước khi gửi. Nộp trễ có thể bị lùi ngày bắt đầu hoặc ảnh hưởng đến suất thực tập.', s:['bosch']},
 {id:'b2', due:'2026-10-02', t:'Giữ bản cứng (bản gốc có dấu) để nộp ngày đầu tiên', d:'Để chung với giấy tờ mang theo ngày 02/10.', s:['bosch']},
]},
{id:'C', name:'Đăng ký môn 61ECE401 với VGU', range:'15/09 – 01/10/2026', start:'2026-09-15', end:'2026-10-01', tasks:[
 {id:'c1', due:'2026-09-22', t:'Điền Internship Registration Form', d:'<ul><li>Họ tên, số CCCD, ngày sinh, nơi sinh</li><li>Công ty: Bosch Global Software Technologies Company Limited (BGSV)</li><li>Địa chỉ: 364 Cộng Hòa, Tân Bình, TP.HCM</li><li>Vị trí: Intern – Embedded Developer Intern (phòng MS/EDA-XC)</li><li>Thông tin supervisor công ty: tên, chức vụ, phòng ban, SĐT, email (chưa biết thì bổ sung ở tuần đầu)</li><li>Thời gian: 6 tháng, từ 02/10/2026 đến 25/03/2027</li><li>Ngày đăng ký + chữ ký sinh viên</li></ul>', s:['form']},
 {id:'c2', due:'2026-09-23', t:'Xin chữ ký GVHD VGU (Supervisor 1) trên form', d:'Form phải có ít nhất một chữ ký của GVHD VGU trước khi nộp.', s:['reg']},
 {id:'c3', due:'2026-09-25', t:'Nộp hồ sơ qua Google Form của ECE Office', d:'Upload PDF: <b>registration form</b> đã có chữ ký GVHD + <b>email offer</b> của Bosch. Chưa có link Google Form thì hỏi ECE Office.', s:['reg']},
 {id:'c4', due:'2026-10-01', t:'Nhận email phê duyệt từ ECE Office', d:'ECE Office kiểm tra → Academic Coordinator duyệt → email cho bạn và GVHD. Form ghi rằng thực tập chỉ được tính từ khi được phê duyệt, nên cố có email này trước 02/10. Đến ~28/09 chưa thấy thì hỏi lại ECE Office.', s:['reg','form']},
 {id:'c5', label:'Cả kỳ', t:'Không đăng ký môn học nào khác trong kỳ thực tập', d:'Chỉ được dự thi lại (nếu có).', s:['guide']},
]},
{id:'D', name:'Pre-boarding trên Bosch Portal', range:'~22/09 – 01/10/2026', start:'2026-09-21', end:'2026-10-01', tasks:[
 {id:'d1', due:'2026-09-23', label:'~22–23/09', t:'Theo dõi email mời vào Bosch Pre-boarding Portal', d:'Email đến khoảng 7–8 ngày làm việc trước 02/10, kèm file <b>Pre-boarding Portal User Guide</b>. Kiểm tra cả Spam. Đến 24/09 chưa nhận được thì email HR.', s:['bosch']},
 {id:'d2', due:'2026-10-01', t:'Đăng ký tài khoản và thiết lập xác thực', d:'Làm theo User Guide.', s:['bosch']},
 {id:'d3', due:'2026-10-01', t:'Khai báo thông tin cá nhân', s:['bosch']},
 {id:'d4', due:'2026-10-01', t:'Upload Digital ID Card và các giấy tờ khác', d:'Chuẩn bị sẵn bản scan CCCD / Digital ID và các giấy tờ User Guide yêu cầu.', s:['bosch']},
 {id:'d5', due:'2026-10-01', t:'Hoàn thành mọi mục onboarding còn lại', d:'Tất cả phải xong <b>trước ngày 02/10</b>. Gặp lỗi thì liên hệ HR đã gửi offer.', s:['bosch']},
 {id:'d6', due:'2026-10-01', t:'Chuẩn bị cho ngày đầu tiên', d:'Bản cứng thư giới thiệu, CCCD; xác nhận giờ có mặt và địa điểm với HR; tìm đường và chỗ gửi xe.', s:['bosch','tip']},
]},
{id:'P', name:'Chuẩn bị chuyên môn trước ngày đầu', range:'19/09 – 01/10/2026', start:'2026-09-19', end:'2026-10-01', note:'Team bạn vào làm về công cụ phần mềm và CI/CT cho automotive (theo JD), không phải viết firmware ECU. Nên 13 ngày này ưu tiên Git – Python – CI, chứ không phải học AUTOSAR.', tasks:[
 {id:'p1', due:'2026-09-24', t:'Ôn C cho chắc: con trỏ, struct, volatile, cấp phát bộ nhớ', d:'Đây là thứ người Bosch hay hỏi và hay dùng nhất. Học ở <b>learncpp.com</b> (miễn phí) và tra cứu ở cppreference.com. Mỗi ngày viết tay 1 chương trình nhỏ thay vì chỉ đọc.', s:['jd','tip']},
 {id:'p2', due:'2026-09-27', t:'Luyện Git thực chiến: branch, rebase, resolve conflict, revert', d:'Chơi hết phần Main + Remote của <b>learngitbranching.js.org</b> (game miễn phí, khoảng 3–4 buổi). Git cơ bản add/commit/push là không đủ khi làm CI.', s:['tip']},
 {id:'p3', due:'2026-09-30', t:'Python cho tự động hóa: đọc/ghi file, regex, gọi lệnh hệ thống', d:'Sách miễn phí <b>Automate the Boring Stuff with Python</b>. Đây là công cụ bạn sẽ dùng hằng ngày để parse log, gom kết quả test, gọi API Jenkins/GitLab.', s:['jd','tip']},
 {id:'p4', due:'2026-10-01', t:'Làm quen CI: tự dựng 1 pipeline "hello world"', d:'Theo <b>jenkins.io/doc/tutorials</b> hoặc GitLab CI quick start. Chỉ cần hiểu: job, stage, artifact, runner. Có trải nghiệm này rồi thì tuần đầu ở công ty đỡ ngợp.', s:['jd','tip']},
 {id:'p5', due:'2026-10-01', t:'Luyện tiếng Anh nói 15 phút/ngày', d:'Môi trường làm việc ở BGSV là tiếng Anh và nhiều review của nhân viên nhấn mạnh điều này. Luyện 3 tình huống: tự giới thiệu, mô tả việc đang làm, nói khi bị kẹt và cần giúp.', s:['jd','tip'], warn:true},
 {id:'p6', due:'2026-09-30', t:'Dựng sẵn hệ thống ghi chép', d:'Tạo thư mục <b>intern-notes</b> gồm: daily-log (nhật ký ngày), glossary (từ điển thuật ngữ), brag-document (thành tích), mentor-1on1, monthly-report. Xem mẫu ở Sổ tay bên dưới. Ghi chép từ ngày đầu là thứ quyết định báo cáo cuối kỳ dễ hay khổ.', s:['tip']},

 {id:'f21', due:'2027-01-20', t:'Hỏi thẳng về cơ hội ở lại full-time', d:'Khoảng tháng thứ 4, hỏi mentor/manager: "Em cần thể hiện được những gì để được cân nhắc cho vị trí chính thức, và quy trình thường diễn ra khi nào?" Hỏi sớm còn kịp điều chỉnh; hỏi vào tháng cuối thì đã muộn. Lưu ý: nhiều review cho thấy tỷ lệ intern được giữ lại ở BGSV là <b>không chắc chắn</b>, nên song song vẫn nên chuẩn bị hồ sơ đi nơi khác.', s:['tip'], warn:true},

const GUIDE = [
{t:'Nhịp một ngày', b:`<p class="g-lead">Toàn bộ kỳ thực tập được quyết định bởi thứ bạn làm lặp đi lặp lại mỗi ngày, không phải bởi vài việc lớn.</p>
<h4>10 phút đầu ngày</h4><ul>
<li>Mở nhật ký hôm nay, viết <b>3 mục tiêu cụ thể</b>. "Sửa xong flaky test X, chạy pass 5/5 lần" chứ không phải "tìm hiểu về CI".</li>
<li>Đọc lại mục "mai làm gì" của hôm qua.</li>
<li>Lướt mail/chat chỉ để bắt việc gấp, chưa trả lời chi tiết.</li></ul>
<h4>Trong ngày</h4><ul>
<li>Làm việc khó nhất vào buổi sáng khi đầu còn khỏe; để họp và việc vặt cho buổi chiều.</li>
<li>Bị kẹt thì áp dụng quy tắc 15–30 phút (xem ô kế bên), đừng ngồi im cả buổi.</li>
<li>Vừa học được gì hoặc vừa sửa được lỗi gì thì <b>ghi ngay 2–3 dòng</b>. Để đến cuối ngày là quên mất phần quan trọng nhất: <i>vì sao</i> nó xảy ra.</li></ul>
<h4>10 phút cuối ngày</h4>
<p>Viết nhật ký theo mẫu bên dưới rồi tắt máy. Việc dở dang thì ghi vào "mai làm gì" — ghi ra rồi mới buông được.</p>`},

{t:'Nhịp một tuần', b:`<ul>
<li><b>Thứ Hai:</b> chọn 1 việc bạn muốn hoàn thành tuần này; chuẩn bị câu hỏi cho buổi 1:1.</li>
<li><b>Giữa tuần:</b> xin feedback ngắn sau mỗi task quan trọng — "anh xem giúp em cách làm này ổn chưa, có gì nên khác đi không ạ". Đừng đợi tới đánh giá giữa kỳ mới biết mình lệch hướng.</li>
<li><b>Thứ Sáu (15 phút):</b> đọc lại 5 ngày nhật ký, tóm thành 3–5 dòng "tuần này mình làm được gì, học được gì", chép sang brag document.</li>
<li><b>Cuối tháng:</b> nhật ký tuần chính là nguyên liệu có sẵn cho báo cáo tháng nộp trường. Viết báo cáo tháng sẽ mất 1–2 tiếng thay vì cả cuối tuần.</li>
<li><b>Ngày phép:</b> dùng rải đều sau các đợt cao điểm, đừng dồn cuối kỳ. Nhưng nhớ ô "số giờ thực tập" — tổng giờ của bạn khá sát ngưỡng 900 AHs.</li></ul>`},

{t:'Mẫu nhật ký cuối ngày', w:1, b:`<p class="g-lead">Chép mẫu này vào một file mỗi ngày, đặt tên theo ngày (2026-10-02.md). Đây là thứ sẽ cứu bạn khi viết báo cáo tháng, báo cáo cuối và khi đi phỏng vấn.</p>

{t:'Quy tắc 15–30 phút khi bị kẹt', b:`<p class="g-lead">Lỗi lớn nhất của intern không phải là hỏi nhiều, mà là im lặng khi kẹt.</p>
<p>Tự loay hoay tối đa <b>15 phút</b> với việc đơn giản, <b>30 phút</b> với việc phức tạp. Mục tiêu của khoảng thời gian đó không phải tự giải bằng mọi giá, mà là thu thập đủ dữ kiện để câu hỏi của bạn có chất lượng:</p>
<ol><li>Tìm trong tài liệu nội bộ trước (wiki, README), không phải Google trước.</li>
<li>Đọc kỹ thông báo lỗi, đừng lướt qua.</li>
<li>Thử 1–2 giả thuyết cụ thể.</li>
<li>Viết ra: đã thử gì, kết quả ra sao, đang nghi gì.</li></ol>
<h4>Hỏi thế nào</h4>
<p class="bad">"Anh ơi pipeline em lỗi, em không biết sao."</p>
<p class="good">"Em chạy stage build của job X thì gặp lỗi [dán đúng dòng log]. Em đã thử build sạch lại — vẫn lỗi; so với log tuần trước thì khác ở bước cài dependency Y. Em nghi lệch version toolchain nhưng chưa biết kiểm tra thế nào cho đúng. Anh chỉ em hướng kiểm tra được không ạ?"</p>
<p>Việc gấp và chặn tiến độ thì hỏi ngay qua chat. Việc không gấp thì gom lại cho buổi 1:1.</p>`},

{t:'Bảo mật: ghi chép sao cho an toàn', b:`<p class="g-lead">Email offer ghi rõ: mọi thông tin có được từ Bosch là bảo mật, tiết lộ ra ngoài cần Bosch đồng ý bằng văn bản. Điều này va thẳng vào việc bạn phải nộp báo cáo cho trường.</p>
<ul><li><b>Tuần đầu phải hỏi mentor:</b> em được đưa những gì vào báo cáo nộp trường? Có cần ai duyệt trước không? Ảnh chụp màn hình có được không?</li>
<li>Không chép ra ngoài: mã nguồn thật, tên dự án/khách hàng thật, số liệu sản phẩm, log build thật, sơ đồ hệ thống nội bộ.</li>
<li>Thay vào đó ghi phần khái quát hóa được:</li></ul>
<p class="bad">Sai: "Sửa file brake_ecu_v3/can_driver.c dòng 245, lỗi timeout CAN ID 0x18F trên xe khách hàng X."</p>
<p class="good">Đúng: "Gặp một dạng lỗi timeout trên bus CAN do cơ chế retry không có backoff. Cách chẩn đoán: log timestamp từng frame rồi đối chiếu với timing trong datasheet."</p>
<p>Tự hỏi trước khi ghi: <i>nếu dòng này lọt ra ngoài, có làm lộ thông tin sản phẩm hay khách hàng không?</i> Có thì bỏ chi tiết, giữ bài học. Cách viết này còn luyện đúng kỹ năng bạn cần khi đi phỏng vấn — nhà tuyển dụng không muốn nghe chi tiết nội bộ Bosch, họ muốn nghe bạn tư duy thế nào.</p>`},

{t:'Đóng góp nào được nhớ đến', b:`<p class="g-lead">Bạn làm ở team công cụ và CI/CT — đây là mảnh đất dễ tạo dấu ấn nhất cho người mới, vì nỗi đau của team rất rõ ràng và đo được.</p>
<ul><li><b>Tự động hóa việc thủ công:</b> gom báo cáo test, dựng môi trường, xử lý file hàng loạt.</li>
<li><b>Sửa flaky test</b> — loại test lúc pass lúc fail. Đây là nỗi đau kinh điển của mọi team CI và gần như luôn có sẵn việc để làm.</li>
<li><b>Rút ngắn thời gian build/pipeline:</b> cache dependency, chạy song song, bỏ bước thừa.</li>
<li><b>Viết tài liệu cho người sau:</b> README cho tool bạn maintain, hướng dẫn onboarding cho intern khóa sau. Việc này "vô hình" nhưng được nhớ rất lâu.</li></ul>
<h4>Luôn ghi lại bằng con số</h4>
<table><tr><th>Yếu</th><th>Mạnh</th></tr>
<tr><td>"Đã cải thiện pipeline"</td><td>"Giảm thời gian build trung bình từ 18 xuống 11 phút nhờ bật cache dependency"</td></tr>
<tr><td>"Sửa vài test lỗi"</td><td>"Sửa 3 flaky test khiến pipeline fail ngẫu nhiên ~15% số lần chạy, kéo xuống dưới 2%"</td></tr>
<tr><td>"Viết script tự động"</td><td>"Script thay quy trình thủ công 45 phút/tuần, nay chạy trong 2 phút"</td></tr></table>
<p>Muốn có con số thì phải <b>đo trước khi sửa</b>. Ngày nhận việc, bấm giờ xem việc thủ công đó mất bao lâu.</p>`},

{t:'8 lỗi intern hay mắc', b:`<ol>
<li><b>Im lặng khi kẹt</b> vì sợ bị đánh giá. Việc nhỏ thành trễ deadline lớn. → quy tắc 15–30 phút.</li>
<li><b>Hứa quá khả năng.</b> Nhận task rồi buột miệng "chiều nay xong". → dành 5 phút ước lượng trước khi cam kết, hoặc nói "em nghĩ khoảng 2 ngày, em cập nhật lại sau khi tìm hiểu".</li>
<li><b>Không đọc tài liệu nội bộ</b> trước khi hỏi.</li>
<li><b>Không tự test trước khi nhờ review.</b> Trước khi tạo merge request: build sạch từ đầu, chạy test liên quan ít nhất một lần, tự đọc lại diff của mình như người ngoài.</li>
<li><b>Làm một mình, không cập nhật tiến độ</b> → team không biết bạn đang ở đâu, dễ lệch hướng cả tuần.</li>
<li><b>Không ghi lại lỗi đã gặp</b> → lặp lại đúng lỗi cũ, mentor phải giải thích lại.</li>
<li><b>Đọc lý thuyết nhiều, tay chạm code ít.</b> Đây là bẫy của người học trường lớp giỏi. Giữ tỷ lệ 30% đọc – 70% làm: học xong khái niệm nào, trong 48 giờ phải áp dụng vào một việc thật.</li>
<li><b>Phòng thủ khi bị review code.</b> Đọc hết comment rồi hãy trả lời; không đồng ý thì hỏi lý do để hiểu, đừng cãi.</li></ol>`},

{t:'Những gì đã biết về BGSV và team của bạn', b:`<p class="g-lead">Mình đã tra cứu; phần nào có nguồn và phần nào là suy đoán đều ghi rõ.</p>
<ul>
<li><b>Team bạn làm công cụ và CI/CT, không phải firmware ECU.</b> JD ghi rõ: phân tích yêu cầu phần mềm automotive, sửa lỗi trong software tool, tham gia thiết kế software tool và CI/CT. Nên đừng dồn sức học AUTOSAR trước ngày đi làm — Git, Python, Jenkins mới là thứ dùng ngay. <span class="tagx">có nguồn: JD đăng công khai</span></li>
<li><b>"XC" là Cross-Domain Computing Solutions</b>, một đơn vị của Bosch khoảng 17.000 người toàn cầu về phần mềm/điện tử xe. Còn <b>"EDA"</b> thì không có tài liệu chính thức nào giải nghĩa; cùng mã EDA còn xuất hiện ở tin tuyển phiên dịch tiếng Trung và trợ giảng tiếng Anh, nên nhiều khả năng đây là mã tổ chức nội bộ chứ không phải thuật ngữ kỹ thuật. Cứ hỏi mentor trong tuần đầu. <span class="tagx">suy đoán có cơ sở</span></li>
<li><b>Giờ làm linh hoạt (flexitime)</b>, thứ Hai–thứ Sáu; Bosch có chính sách bù giờ. <span class="tagx">có nguồn</span></li>
<li><b>Môi trường tiếng Anh.</b> Review nhân viên nhắc đi nhắc lại rằng tiếng Anh là điều kiện để trụ được, kể cả kỹ thuật giỏi. <span class="tagx">ý kiến nhiều người</span></li>
<li><b>Mức hỗ trợ của bạn đúng chuẩn công ty</b> — ăn trưa 60k/ngày và gửi xe 200k/tháng khớp chính xác chính sách chung của BGSV. Trợ cấp 4,25 triệu thấp hơn trung bình thực tập IT ở TP.HCM một chút (~4,66 triệu theo số liệu Indeed), nhưng đi kèm phụ cấp và bảo hiểm mà nhiều nơi không có. <span class="tagx">có nguồn</span></li>
<li><b>Cơ hội lên chính thức: không chắc chắn.</b> Vài review và thảo luận diễn đàn nói intern ở đây ít khi được chuyển thành nhân viên chính thức, kèm lo ngại về dư nhân sự mảng automotive. Không có số liệu chính thức. Nên: cứ nỗ lực để được giữ, nhưng tháng thứ 4 hãy hỏi thẳng về quy trình, và vẫn chuẩn bị hồ sơ cho nơi khác. <span class="tagx">ý kiến cá nhân, không phải số liệu</span></li>
<li>Chưa tra được: lịch onboarding tuần đầu, hệ thống nội bộ, quy định thẻ/VPN/laptop, nội dung NDA cho intern. Những thứ này chỉ biết khi vào — cứ hỏi HR và mentor, đừng ngại.</li></ul>`},

{t:'Lộ trình học 6 tháng', w:1, b:`<table class="g-road"><tr><th>Giai đoạn</th><th>Học gì</th><th>Vì sao</th><th>Tài nguyên miễn phí</th></tr>

function renderGuide(){
  return '<section class="guide" id="so-tay"><div class="guide-head"><h2>Sổ tay thực tập</h2>'
    + '<p>Phần checklist ở trên là thủ tục bắt buộc. Phần này là cách làm việc — đọc một lần trước ngày 02/10, rồi quay lại khi cần.</p></div>'
    + '<div class="guide-grid">'
    + GUIDE.map(function(g){ return '<article class="gcard' + (g.w ? ' wide' : '') + '"><h3>' + esc(g.t) + '</h3>' + g.b + '</article>'; }).join('')
    + '</div></section>';
}

// ---- state ----
let done = new Set();
try{ done = new Set(JSON.parse(document.getElementById('saved-state').textContent).done||[]); }catch(e){}
let filter = 'all';
try{ filter = localStorage.getItem('bosch-intern-filter') || 'all'; }catch(e){}
const openDone = new Set();

const all = PHASES.flatMap(p=>p.tasks.map(t=>({...t, phase:p})));
const req = all.filter(t=>!t.opt);

function chipFor(t){
  if(done.has(t.id)) return {s:'done', txt:'Xong'};
  if(!t.due) return {s:'', txt:t.label||''};
  const days = Math.round((P(t.due)-TODAY)/864e5);
  const base = t.label || fmt(t.due);
  if(days<0) return {s:'late', txt:'Quá hạn · '+base};
  if(days<=3) return {s:'soon', txt:(days===0?'Hôm nay':days===1?'Ngày mai':'Còn '+days+' ngày')+(t.label?' · '+t.label:' · '+fmt(t.due))};
  return {s:'', txt:base};
}
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const nDone = req.filter(t=>done.has(t.id)).length;
  const pct = Math.round(nDone/req.length*100);
  const upcoming = all.filter(t=>!done.has(t.id) && t.due && !t.opt).sort((a,b)=>P(a.due)-P(b.due));
  const nx = upcoming[0];
  const late = upcoming.filter(t=>P(t.due)<TODAY).length;
  const daysToStart = Math.round((P('2026-10-02')-TODAY)/864e5);
  const startTxt = daysToStart>0 ? daysToStart+' ngày' : (daysToStart===0?'Hôm nay':'Đã bắt đầu');

  let h = `<header class="top">
    <div><div class="eyebrow">Hoàng Minh Khoa · VGU ECE · Module 61ECE401</div>
    <h1>Lộ trình thực tập Embedded Developer tại Bosch</h1>
    <p class="sub">Mọi việc cần làm từ hôm nay đến khi có điểm, tổng hợp từ email offer, JD và bộ tài liệu thực tập của ECE. Tick vào ô khi xong — tiến độ được lưu lại. Cuối trang có <a class="jump" href="#so-tay">Sổ tay thực tập</a>: nhịp ngày, cách ghi chép, cách gây ấn tượng.</p></div>
    <div class="status">
      <div class="stat"><span class="k">Tiến độ</span><span class="v mono">${nDone}/${req.length}</span><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="stat"><span class="k">Việc gần nhất</span>${nx?`<span class="next-title">${esc(nx.t)}</span><span><span class="chip" data-s="${chipFor(nx).s}">${esc(chipFor(nx).txt)}</span></span>`:'<span class="next-title">Đã xong tất cả</span>'}</div>
      <div class="stat"><span class="k">Đến ngày bắt đầu (02/10)</span><span class="v mono">${startTxt}</span>${late?`<span class="chip" data-s="late" style="justify-self:start">${late} việc quá hạn</span>`:''}</div>
    </div></header>
    <div class="toolbar"><div class="seg" role="group" aria-label="Lọc">
      <button id="f-all" aria-pressed="${filter==='all'}" data-f="all">Tất cả</button>
      <button id="f-open" aria-pressed="${filter==='open'}" data-f="open">Chưa xong</button></div>
      <span class="save" id="save-state" data-s="${saveState}">${saveText[saveState]}</span></div>
    <div class="layout"><main>`;

  for(const p of PHASES){
    const pr = p.tasks.filter(t=>!t.opt);
    const pd = pr.filter(t=>done.has(t.id)).length;
    const state = pd===pr.length ? 'done' : (TODAY>=P(p.start) && TODAY<=P(p.end)) || (TODAY>P(p.end)) ? 'now' : '';
    const shown = p.tasks.filter(t=>filter==='all' || !done.has(t.id));
    h += `<section class="phase" data-state="${state}"><span class="node"></span>
      <div class="phase-head"><h2>${esc(p.name)}</h2><span class="range mono">${esc(p.range)}</span><span class="count">${pd}/${pr.length} xong</span></div>
      ${p.note?`<p class="sub" style="margin:0 0 10px;font-size:13.5px">${esc(p.note)}</p>`:''}
      <div class="tasks">`;
    if(!shown.length) h += `<div class="empty">Đã xong hết giai đoạn này.</div>`;
    for(const t of shown){
      const c = chipFor(t), isD = done.has(t.id);
      h += `<div class="task${isD?' is-done':''}${openDone.has(t.id)?' open':''}">
        <input type="checkbox" id="cb-${t.id}" data-id="${t.id}" ${isD?'checked':''}>
        <label for="cb-${t.id}">${esc(t.t)}</label>
        ${c.txt?`<span class="chip mono" data-s="${c.s}">${esc(c.txt)}</span>`:'<span></span>'}
        ${t.d?`<div class="detail">${t.d}</div>`:''}
        <div class="meta">${t.opt?'<span class="tag">Tùy trường hợp</span>':''}${t.warn?'<span class="tag warn">Lưu ý</span>':''}<span class="src">Nguồn: ${t.s.map(k=>SRC[k]).join(' · ')}</span>${isD&&t.d?` <button class="more" data-more="${t.id}">${openDone.has(t.id)?'Ẩn chi tiết':'Xem chi tiết'}</button>`:''}</div>
      </div>`;
    }
    h += `</div></section>`;
  }

  h += `</main><aside>
    <div class="panel"><h3>Offer</h3><dl>
      <dt>Vị trí</dt><dd>Embedded Developer Intern</dd>
      <dt>Phòng</dt><dd>MS/EDA-XC</dd>
      <dt>Thời gian</dt><dd class="mono">02/10/26 – 25/03/27</dd>

// ---- lưu tiến độ: localStorage + Supabase (tùy chọn) ----
var saveState = 'local';
var saveText = {local:'Lưu trên máy này', saving:'Đang lưu…', saved:'Đã đồng bộ', error:'Lỗi đồng bộ · bấm để xem', idle:'Lưu trên máy này'};
var CFG_KEY = 'bosch-intern-supabase', DONE_KEY = 'bosch-intern-done';
var cfg = null, lastError = '';
try { cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); } catch(e){}
// Nhận cấu hình từ link chia sẻ: <trang>#sync=<base64>
try {
  var hs = ((location.hash || '') + '&' + (location.search || '')).match(/sync=([A-Za-z0-9_\-=]+)/);
  if(hs){
    var o = JSON.parse(atob(hs[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(o && o.url && o.key){
      cfg = {url: o.url, key: o.key};
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      history.replaceState(null, '', location.pathname + location.search);
    }
  }
} catch(e){}

function setSave(s, err){
  saveState = s; if(s === 'error' && err) lastError = err;
  var el = document.getElementById('save-state');
  if(el){ el.dataset.s = s; el.textContent = saveText[s]; el.style.cursor = s === 'error' ? 'pointer' : ''; el.onclick = s === 'error' ? openCfg : null; }
}
function saveLocal(){ try{ localStorage.setItem(DONE_KEY, JSON.stringify([...done])); }catch(e){} }
function baseUrl(u){
  var s = String(u||'').trim();
  var m = s.match(/supabase\.(?:com|co)\/dashboard\/project\/([a-z0-9]+)/i);
  if(m) return 'https://' + m[1] + '.supabase.co';           // dán nhầm link dashboard -> tự đổi sang API URL
  return s.replace(/\/+$/,'').replace(/\/rest\/v1$/,'');
}

function api(path, opts){
  opts = opts || {};
  return fetch(baseUrl(cfg.url) + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: Object.assign({'apikey': cfg.key, 'Authorization': 'Bearer ' + cfg.key, 'Content-Type': 'application/json'}, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(async r => {
    if(!r.ok){ var txt = await r.text(); var e = new Error(txt || ('HTTP ' + r.status)); e.status = r.status; throw e; }
    return r.status === 204 ? null : r.json();
  });
}

// Dịch lỗi kỹ thuật sang tiếng người
function explain(err){
  var s = err && err.status, t = (err && err.message) || String(err);
  if(!s && /Failed to fetch|NetworkError|Load failed/i.test(t)){
    return location.protocol === 'file:'
      ? 'Không gọi được Supabase. Bạn đang mở file trực tiếp (file://) — nhiều trình duyệt chặn kiểu này. Cách sửa: đưa index.html lên GitHub Pages rồi mở bằng https, hoặc kiểm tra mạng / project Supabase có đang bị paused không.'
      : 'Không gọi được Supabase: kiểm tra mạng, Project URL có đúng dạng https://xxxx.supabase.co không, và project có bị paused trong dashboard không (free plan tự dừng sau ~1 tuần không dùng, bấm Restore là chạy lại).';
  }
  if(s === 404 || /does not exist|PGRST205|Could not find the table/i.test(t))
    return 'Chưa có bảng internship_progress. Vào Supabase → SQL Editor → New query → dán toàn bộ file supabase-setup.sql → Run, rồi thử lại.';
  if(s === 401)
    return 'Key không hợp lệ. Vào Project Settings → API, copy lại key "anon public" (hoặc "publishable"), dán đủ cả chuỗi, không thừa dấu cách.';
  if(s === 403 || /42501|row-level security|permission denied/i.test(t))
    return 'Key đúng nhưng bảng chặn quyền ghi (RLS). Chạy lại phần "create policy" trong supabase-setup.sql, rồi thử lại.';
  if(s === 409 || /23505/.test(t))
    return 'Trùng khóa khi ghi. Thử tải lại trang rồi tick lại một lần.';
  if(s === 503 || s === 502 || s === 504)
    return 'Supabase đang không phản hồi (có thể project bị paused). Mở dashboard Supabase, bấm Restore project, rồi thử lại.';
  return 'Lỗi ' + (s || '') + ': ' + t.slice(0, 300);
}

function push(ids){
  if(!cfg || !ids.length) return Promise.resolve();
  var now = new Date().toISOString();
  var body = ids.map(id => ({task_id: id, done: done.has(id), updated_at: now}));
  setSave('saving');
  return api('internship_progress', {method:'POST', body: body, headers:{'Prefer':'resolution=merge-duplicates'}})
    .then(()=>setSave('saved')).catch(err=>{ console.warn(err); setSave('error', explain(err)); });
}

function pull(){
  if(!cfg) return Promise.resolve();
  setSave('saving');
  return api('internship_progress?select=task_id,done').then(rows => {
    var remote = new Set(rows.filter(r=>r.done).map(r=>r.task_id));
    var localOnly = [...done].filter(id => !remote.has(id));
    localOnly.forEach(id => remote.add(id));
    done = remote; saveLocal(); render(); setSave('saved');
    if(localOnly.length) push(localOnly);
  }).catch(err => { console.warn(err); setSave('error', explain(err)); });
}

var _render = render;
render = function(){
  _render();
  var tb = document.querySelector('.toolbar');
  if(tb && !tb.querySelector('.cfg-btn')){
    var b = document.createElement('button');
    b.className = 'btn cfg-btn'; b.type = 'button';
    b.textContent = cfg ? 'Đồng bộ: đang bật' : 'Bật đồng bộ nhiều máy';
    b.onclick = openCfg; tb.insertBefore(b, tb.lastElementChild);
  }
  if(saveState === 'error') setSave('error');
};

function openCfg(){
  var d = document.getElementById('cfg-dialog');
  d.querySelector('#cfg-url').value = cfg ? cfg.url : '';
  d.querySelector('#cfg-key').value = cfg ? cfg.key : '';
  say(lastError || '', lastError ? 'bad' : '');
  d.hidden = false;
}
function say(msg, kind){
  var el = document.getElementById('cfg-msg');
  if(!el) return;
  el.innerHTML = ''; el.textContent = msg || ''; el.hidden = !msg; el.dataset.kind = kind || '';
}

function check(){
  var url = baseUrl(document.getElementById('cfg-url').value);
  var key = document.getElementById('cfg-key').value.trim();
  if(!url || !key) return say('Chưa điền đủ Project URL và key.', 'bad');
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)/i.test(url)) return say('Project URL chưa đúng. Phải là https://<project-ref>.supabase.co lấy ở Project Settings → Data API, không phải link dashboard đang mở trên trình duyệt.', 'bad');
  if(/^sb_secret_|service_role/i.test(key)) return say('Đây là key bí mật (service_role / secret). Dùng key "anon public" hoặc "publishable" thay vào — key bí mật không được dán vào trang web.', 'bad');
  say('Đang kiểm tra…', '');
  var saved = cfg; cfg = {url: url, key: key};
  api('internship_progress?select=task_id&limit=1')
    .then(()=>{ say('Kết nối tốt (' + url + '). Bấm "Lưu và đồng bộ" để bật.', 'ok'); cfg = saved; })
    .catch(err => { console.warn(err); say(explain(err), 'bad'); cfg = saved; });
}

function buildDialog(){
  var d = document.createElement('div');
  d.id = 'cfg-dialog'; d.hidden = true; d.className = 'modal';
  d.innerHTML = '<div class="modal-card"><h2>Đồng bộ nhiều thiết bị</h2>'
    + '<p>Dán Project URL và anon public key của Supabase (xem README). Để trống nếu chỉ muốn lưu trên máy này.</p>'
    + '<label for="cfg-url">Project URL</label><input id="cfg-url" placeholder="https://xxxx.supabase.co" autocomplete="off" spellcheck="false">'
    + '<label for="cfg-key">Anon public key</label><input id="cfg-key" placeholder="eyJhbGciOi... hoặc sb_publishable_..." autocomplete="off" spellcheck="false">'
    + '<p id="cfg-msg" hidden></p>'
    + '<div class="modal-row"><button class="btn primary" id="cfg-save" type="button">Lưu và đồng bộ</button>'
    + '<button class="btn" id="cfg-check" type="button">Kiểm tra kết nối</button>'
    + '<button class="btn" id="cfg-clear" type="button">Tắt đồng bộ</button>'
    + '<button class="btn" id="cfg-link" type="button">Copy link cho điện thoại</button>'
    + '<button class="btn" id="cfg-export" type="button">Xuất file JSON</button>'
    + '<label class="btn" for="cfg-import">Nhập file JSON</label><input type="file" id="cfg-import" accept="application/json" hidden>'
    + '<button class="btn" id="cfg-close" type="button">Đóng</button></div>'
    + '<p class="hint">Tiến độ luôn được lưu trên máy này kể cả khi đồng bộ lỗi — không mất gì. Key anon là public, chỉ chạm được bảng tiến độ; đừng dán service_role key.</p></div>';
  document.body.appendChild(d);
  d.addEventListener('click', e => { if(e.target === d) d.hidden = true; });
  d.querySelector('#cfg-close').onclick = ()=> d.hidden = true;
  d.querySelector('#cfg-check').onclick = check;
  d.querySelector('#cfg-save').onclick = ()=>{
    var url = baseUrl(d.querySelector('#cfg-url').value), key = d.querySelector('#cfg-key').value.trim();
    if(!url || !key) return say('Chưa điền đủ Project URL và key.', 'bad');
    cfg = {url: url, key: key};
    try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){}
    lastError = ''; render(); pull().then(()=>{ if(saveState === 'error') say(lastError, 'bad'); else d.hidden = true; });
  };
  d.querySelector('#cfg-clear').onclick = ()=>{ cfg = null; lastError = ''; try{ localStorage.removeItem(CFG_KEY); }catch(e){} d.hidden = true; setSave('local'); render(); };
  d.querySelector('#cfg-link').onclick = ()=>{
    var url = baseUrl(d.querySelector('#cfg-url').value), key = d.querySelector('#cfg-key').value.trim();
    if(!url || !key) return say('Điền Project URL và key trước đã.', 'bad');
    if(location.protocol === 'file:') return say('Link chỉ dùng được khi trang chạy trên web (GitHub Pages). Trang này đang mở từ ổ đĩa nên điện thoại không mở được.', 'bad');
    var tok = btoa(JSON.stringify({url: url, key: key})).replace(/\+/g,'-').replace(/\//g,'_');
    var link = location.origin + location.pathname + '?v=' + Date.now() + '#sync=' + tok;
    var show = (pre)=>{
      var el = document.getElementById('cfg-msg');
      el.hidden = false; el.dataset.kind = 'ok';
      el.innerHTML = '';
      var p1 = document.createElement('div'); p1.textContent = pre; el.appendChild(p1);
      var ta = document.createElement('textarea');
      ta.readOnly = true; ta.rows = 3; ta.value = link; ta.id = 'cfg-linkbox';
      ta.style.cssText = 'width:100%;margin-top:8px;font:12px/1.4 ui-monospace,monospace;word-break:break-all;padding:8px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit';
      ta.onclick = ()=> ta.select();
      el.appendChild(ta);
    };
    if(navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(link).then(
        ()=> show('Đã copy link. Gửi cho chính mình qua Zalo/Messenger/email rồi mở trên điện thoại. Nếu app chat cắt mất phần sau dấu #, copy thủ công ô dưới đây:'),
        ()=> show('Copy thủ công link dưới đây (bấm vào ô để bôi đen hết):'));
    else show('Copy thủ công link dưới đây (bấm vào ô để bôi đen hết):');
  };
  d.querySelector('#cfg-export').onclick = ()=>{
    var blob = new Blob([JSON.stringify({done:[...done], exportedAt:new Date().toISOString()}, null, 2)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'tien-do-thuc-tap.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  };
  d.querySelector('#cfg-import').onchange = e => {
    var f = e.target.files[0]; if(!f) return;
    f.text().then(txt => { var o = JSON.parse(txt); (o.done||[]).forEach(id => done.add(id)); saveLocal(); render(); if(cfg) push([...done]); d.hidden = true; })
      .catch(()=>say('File JSON không đọc được.', 'bad'));
  };
}

document.addEventListener('change', e => {
  var cb = e.target.closest('input[data-id]'); if(!cb) return;
  cb.checked ? done.add(cb.dataset.id) : done.delete(cb.dataset.id);
  saveLocal(); render(); cfg ? push([cb.dataset.id]) : setSave('local');
});
document.addEventListener('click', e => {
  var f = e.target.closest('[data-f]');
  if(f){ filter = f.dataset.f; try{ localStorage.setItem('bosch-intern-filter', filter); }catch(_){} render(); return; }
  var m = e.target.closest('[data-more]');
  if(m){ var id = m.dataset.more; openDone.has(id) ? openDone.delete(id) : openDone.add(id); render(); }
});

try{ var ls = JSON.parse(localStorage.getItem(DONE_KEY) || '[]'); if(Array.isArray(ls)) ls.forEach(x => done.add(x)); }catch(e){}
buildDialog();
render();
if(cfg){ pull(); setInterval(pull, 60000); window.addEventListener('focus', pull); }
})();
